
<style>
/* HEY EDUKASI - TOOLS GUI */
.edu-tools{
  --bg:#0b1020;
  --panel:#151d33;
  --line:#293653;
  --blue:#6685ff;
  --purple:#a56bff;
  --text:#f5f7ff;
  --muted:#a4b1d0;
  color:var(--text);
  font-family:system-ui,sans-serif;
  max-width:520px;
  margin:20px auto;
}
.edu-tools *{box-sizing:border-box}
.edu-head{margin-bottom:16px}
.edu-head h2{margin:0;font-size:24px}
.edu-head p{margin:5px 0;color:var(--muted);font-size:13px}
.edu-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;padding:6px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:14px;margin-bottom:14px
}
.edu-tab{
  border:0;border-radius:10px;padding:12px;
  background:transparent;color:var(--muted);
  font-size:14px;font-weight:700
}
.edu-tab.active{
  background:linear-gradient(120deg,var(--blue),var(--purple));
  color:white
}
.edu-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;padding:16px;
}
.edu-panel[hidden]{display:none}
.edu-label{
  color:var(--muted);font-size:12px;
  letter-spacing:1px;text-transform:uppercase
}
.edu-display{
  background:var(--bg);border:1px solid var(--line);
  border-radius:14px;padding:17px 13px;
  margin:10px 0 14px;text-align:right;
  overflow-wrap:anywhere
}
.edu-expression{color:var(--muted);font-size:13px;min-height:20px}
.edu-result{font-size:34px;font-weight:750;min-height:45px}
.edu-keys{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px
}
.edu-key{
  border:1px solid var(--line);
  border-radius:12px;min-height:51px;
  background:#202b46;color:var(--text);
  font-size:18px;font-weight:650;
  cursor:pointer
}
.edu-key:active{transform:scale(.97)}
.edu-key.op{background:#27365d;color:#b9c7ff}
.edu-key.special{background:#34264f;color:#d7baff}
.edu-key.equal{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  border:0;color:white
}
.edu-key.wide{grid-column:span 2}
.edu-note{
  color:var(--muted);font-size:12px;
  text-align:center;margin:13px 0 0
}
.edu-time{
  text-align:center;padding:23px 8px 17px
}
.edu-clock{
  font-size:clamp(48px,13vw,68px);
  font-weight:800;letter-spacing:2px;
  font-variant-numeric:tabular-nums;
  line-height:1.2;margin:12px 0
}
.edu-clock-caption{color:var(--muted);font-size:13px}
.edu-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edu-field label{
  display:block;font-size:12px;color:var(--muted);margin-bottom:6px
}
.edu-field input{
  width:100%;padding:12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);
  color:var(--text);font-size:16px;outline:none
}
.edu-field input:focus{border-color:var(--blue)}
.edu-actions{display:flex;gap:8px;margin-top:14px}
.edu-btn{
  flex:1;padding:12px 8px;border:1px solid var(--line);
  border-radius:12px;background:#202b46;
  color:white;font-size:14px;font-weight:700;cursor:pointer
}
.edu-btn.primary{
  background:linear-gradient(120deg,var(--blue),var(--purple));
  border:0
}
.edu-status{
  text-align:center;min-height:22px;margin-top:14px;
  color:var(--muted);font-size:13px
}
.edu-progress{
  height:5px;background:#27324d;border-radius:10px;
  overflow:hidden;margin:0 4px
}
.edu-progress div{
  height:100%;width:100%;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  transition:width .3s linear
}
@media(max-width:360px){
  .edu-panel{padding:12px}
  .edu-key{min-height:46px}
  .edu-clock{font-size:45px}
}
</style>

<div class="edu-tools" id="heyTools">
  <div class="edu-head">
    <h2>🧰 Alat Belajar</h2>
    <p>Kalkulator dan timer belajar dalam satu tempat.</p>
  </div>

  <div class="edu-tabs">
    <button class="edu-tab active" data-tab="calculator">🧮 Kalkulator</button>
    <button class="edu-tab" data-tab="timer">⏱️ Timer</button>
  </div>

  <!-- KALKULATOR -->
  <section class="edu-panel" id="eduCalculator">
    <div class="edu-label">Kalkulator matematika</div>
    <div class="edu-display">
      <div class="edu-expression" id="eduExpression">Siap menghitung</div>
      <div class="edu-result" id="eduResult" aria-live="polite">0</div>
    </div>

    <div class="edu-keys">
      <button class="edu-key special" data-action="clear">AC</button>
      <button class="edu-key special" data-action="back">⌫</button>
      <button class="edu-key op" data-value="%">%</button>
      <button class="edu-key op" data-value="/">÷</button>

      <button class="edu-key" data-value="7">7</button>
      <button class="edu-key" data-value="8">8</button>
      <button class="edu-key" data-value="9">9</button>
      <button class="edu-key op" data-value="*">×</button>

      <button class="edu-key" data-value="4">4</button>
      <button class="edu-key" data-value="5">5</button>
      <button class="edu-key" data-value="6">6</button>
      <button class="edu-key op" data-value="-">−</button>

      <button class="edu-key" data-value="1">1</button>
      <button class="edu-key" data-value="2">2</button>
      <button class="edu-key" data-value="3">3</button>
      <button class="edu-key op" data-value="+">+</button>

      <button class="edu-key wide" data-value="0">0</button>
      <button class="edu-key" data-value=".">.</button>
      <button class="edu-key equal" data-action="equals">=</button>
    </div>
    <p class="edu-note">Contoh: 25 × 4 = 100</p>
  </section>

  <!-- TIMER -->
  <section class="edu-panel" id="eduTimer" hidden>
    <div class="edu-label">Timer fokus belajar</div>
    <div class="edu-time">
      <div style="font-size:32px">🎯</div>
      <div class="edu-clock" id="eduClock" aria-live="polite">05:00</div>
      <div class="edu-clock-caption" id="eduClockCaption">Siap untuk mulai belajar?</div>
    </div>

    <div class="edu-progress"><div id="eduProgress"></div></div>

    <div style="height:20px"></div>
    <div class="edu-fields">
      <div class="edu-field">
        <label for="eduMinutes">Menit</label>
        <input id="eduMinutes" type="number" min="0" max="999" value="5">
      </div>
      <div class="edu-field">
        <label for="eduSeconds">Detik</label>
        <input id="eduSeconds" type="number" min="0" max="59" value="0">
      </div>
    </div>

    <div class="edu-actions">
      <button class="edu-btn primary" id="eduStart">▶ Mulai</button>
      <button class="edu-btn" id="eduPause">Ⅱ Jeda</button>
      <button class="edu-btn" id="eduReset">↻ Ulang</button>
    </div>
    <div class="edu-status" id="eduStatus" aria-live="polite">Atur waktu lalu tekan Mulai.</div>
  </section>
</div>

<script>
(function(){
  const root = document.getElementById("heyTools");
  if(!root || root.dataset.ready) return;
  root.dataset.ready = "yes";

  /* TAB */
  root.querySelectorAll(".edu-tab").forEach(function(btn){
    btn.addEventListener("click",function(){
      root.querySelectorAll(".edu-tab").forEach(function(t){
        t.classList.toggle("active",t===btn);
      });
      document.getElementById("eduCalculator").hidden =
        btn.dataset.tab !== "calculator";
      document.getElementById("eduTimer").hidden =
        btn.dataset.tab !== "timer";
    });
  });

  /* KALKULATOR */
  let expression = "";
  let justCalculated = false;
  const resultEl = document.getElementById("eduResult");
  const expressionEl = document.getElementById("eduExpression");

  function showResult(value){
    resultEl.textContent = value;
  }
  function addValue(value){
    if(justCalculated && /[0-9.]/.test(value)){
      expression = "";
    }
    justCalculated = false;
    if(expression.length >= 90) return;
    expression += value;
    expressionEl.textContent = expression;
    showResult(expression);
  }
  function clearCalc(){
    expression = "";
    justCalculated = false;
    expressionEl.textContent = "Siap menghitung";
    showResult("0");
  }
  function backCalc(){
    expression = expression.slice(0,-1);
    expressionEl.textContent = expression || "Siap menghitung";
    showResult(expression || "0");
    justCalculated = false;
  }
  function calculate(){
    if(!expression) return;
    try{
      if(!/^[0-9+\-*/%.()\s]+$/.test(expression))
        throw Error();
      if(/[+\-*/%.(]\s*$/.test(expression))
        throw Error();

      // Evaluasi hanya untuk ekspresi berisi karakter matematika.
      const answer = Function('"use strict";return ('+expression+')')();
      if(typeof answer !== "number" || !Number.isFinite(answer))
        throw Error();

      expressionEl.textContent = expression + " =";
      expression = String(Number(answer.toPrecision(12)));
      showResult(expression);
      justCalculated = true;
    }catch(e){
      expressionEl.textContent = "Hitungan belum valid";
      showResult("Periksa lagi");
      expression = "";
      justCalculated = false;
    }
  }

  root.querySelectorAll(".edu-key").forEach(function(btn){
    btn.addEventListener("click",function(){
      const action = btn.dataset.action;
      if(action === "clear") clearCalc();
      else if(action === "back") backCalc();
      else if(action === "equals") calculate();
      else if(btn.dataset.value) addValue(btn.dataset.value);
    });
  });

  /* TIMER */
  const minInput = document.getElementById("eduMinutes");
  const secInput = document.getElementById("eduSeconds");
  const clock = document.getElementById("eduClock");
  const caption = document.getElementById("eduClockCaption");
  const status = document.getElementById("eduStatus");
  const progress = document.getElementById("eduProgress");
  const startBtn = document.getElementById("eduStart");

  let remaining = 300;
  let total = 300;
  let deadline = 0;
  let interval = null;

  function formatTime(value){
    const m = Math.floor(value/60);
    const s = value%60;
    return String(m).padStart(2,"0")+":"+
           String(s).padStart(2,"0");
  }
  function renderTimer(){
    clock.textContent = formatTime(remaining);
    progress.style.width =
      (total > 0 ? Math.max(0,remaining/total*100) : 0) + "%";
  }
  function readTime(){
    const m = Number(minInput.value);
    const s = Number(secInput.value);
    if(minInput.value === "" || secInput.value === "" ||
       !Number.isInteger(m) || !Number.isInteger(s) ||
       m < 0 || m > 999 || s < 0 || s > 59 || m*60+s <= 0){
      status.textContent = "Masukkan waktu lebih dari 0 detik.";
      return false;
    }
    total = m*60+s;
    remaining = total;
    renderTimer();
    return true;
  }
  function stopTimer(){
    if(interval !== null){
      clearInterval(interval);
      interval = null;
    }
  }
  function tick(){
    remaining = Math.max(0,Math.ceil((deadline-Date.now())/1000));
    renderTimer();
    if(remaining <= 0){
      stopTimer();
      caption.textContent = "Sesi selesai!";
      status.textContent = "🎉 Waktu habis! Bagus, kamu sudah fokus belajar.";
      startBtn.textContent = "▶ Mulai lagi";
      beep();
    }
  }
  function startTimer(){
    if(interval !== null) return;
    if(remaining <= 0 && !readTime()) return;
    if(remaining <= 0) return;

    deadline = Date.now()+remaining*1000;
    caption.textContent = "Fokus belajar, kamu pasti bisa!";
    status.textContent = "Timer sedang berjalan…";
    startBtn.textContent = "▶ Lanjut";
    interval = setInterval(tick,200);
    tick();
  }
  function pauseTimer(){
    if(interval === null){
      status.textContent = "Timer sedang tidak berjalan.";
      return;
    }
    tick();
    stopTimer();
    status.textContent = "Timer dijeda.";
    caption.textContent = "Istirahat sebentar jika perlu.";
  }
  function resetTimer(){
    stopTimer();
    if(!readTime()){
      total = 0;
      remaining = 0;
      renderTimer();
      return;
    }
    caption.textContent = "Siap untuk mulai belajar?";
    status.textContent = "Timer diatur ulang.";
    startBtn.textContent = "▶ Mulai";
  }
  function beep(){
    try{
      const AudioContextClass = window.AudioContext ||
                                window.webkitAudioContext;
      if(!AudioContextClass) return;
      const ctx = new AudioContextClass();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.frequency.value = 880;
      gain.gain.value = 0.12;
      oscillator.start();
      setTimeout(function(){
        oscillator.stop();
        ctx.close();
      },350);
    }catch(e){}
  }

  startBtn.addEventListener("click",startTimer);
  document.getElementById("eduPause").addEventListener("click",pauseTimer);
  document.getElementById("eduReset").addEventListener("click",resetTimer);

  [minInput,secInput].forEach(function(input){
    input.addEventListener("change",function(){
      if(interval === null) resetTimer();
    });
  });

  renderTimer();
})();
</script>
