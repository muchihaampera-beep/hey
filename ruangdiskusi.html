
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Diskusi</title>
<style>
:root{
 --bg:#313338;--side:#2b2d31;--deep:#1e1f22;
 --panel:#383a40;--text:#f2f3f5;--muted:#aeb2bb;
 --accent:#5865f2;--hover:#404249;--line:#45474e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,Helvetica,sans-serif;height:100dvh;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;border:0;color:inherit}
.app{height:100dvh;display:flex}
.servers{width:70px;background:var(--deep);padding:12px 10px;
 display:flex;align-items:center;gap:10px;flex-direction:column;flex-shrink:0}
.server{width:48px;height:48px;border-radius:17px;background:var(--side);
 display:grid;place-items:center;font-size:22px;font-weight:bold;
 transition:.2s;position:relative}
.server:hover,.server.active{border-radius:14px;background:var(--accent)}
.server.active:before{content:"";position:absolute;left:-10px;width:4px;
 height:30px;background:white;border-radius:0 5px 5px 0}
.separator{height:2px;width:32px;background:#3b3d43}
.add{color:#23a559;font-size:28px}
.sidebar{width:235px;background:var(--side);display:flex;flex-direction:column;
 flex-shrink:0}
.workspace{height:60px;padding:0 17px;display:flex;align-items:center;
 justify-content:space-between;border-bottom:1px solid var(--deep);
 font-weight:bold;box-shadow:0 2px 5px #0002}
.workspace button{background:none;color:var(--muted);font-size:22px}
.channels{padding:18px 9px;overflow-y:auto;flex:1}
.label{font-size:11px;color:var(--muted);font-weight:bold;
 letter-spacing:.7px;margin:8px 5px 10px;display:flex;justify-content:space-between}
.channel{padding:10px;border-radius:5px;color:var(--muted);display:flex;
 gap:9px;align-items:center;margin-bottom:3px;cursor:pointer}
.channel:hover,.channel.active{background:var(--hover);color:white}
.channel span:first-child{font-size:20px;color:#969aa4}
.userbox{height:64px;background:#232428;padding:9px;display:flex;
 align-items:center;gap:9px}
.avatar{width:37px;height:37px;border-radius:50%;background:var(--accent);
 display:grid;place-items:center;font-size:21px;flex-shrink:0}
.username{font-size:13px;font-weight:bold}
.status{font-size:11px;color:#23a559;margin-top:4px}
.user-actions{margin-left:auto;display:flex;gap:5px}
.user-actions button{background:transparent;padding:6px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;border-bottom:1px solid var(--deep);display:flex;
 align-items:center;padding:0 17px;gap:10px;box-shadow:0 2px 5px #0001}
.hash{font-size:25px;color:var(--muted)}
#channelTitle{font-weight:bold}
.topbar .spacer{flex:1}
.topbar button{background:transparent;color:var(--muted);font-size:20px}
.topbar button:hover{color:white}
.content{flex:1;display:flex;min-height:0}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.welcome{padding:25px 20px 10px}
.welcome-icon{width:58px;height:58px;border-radius:50%;background:var(--panel);
 display:grid;place-items:center;font-size:30px;margin-bottom:15px}
.welcome h2{font-size:24px;margin:0 0 8px}
.welcome p{color:var(--muted);font-size:13px;margin:0}
.messages{flex:1;overflow-y:auto;padding:10px 18px 20px}
.message{display:flex;gap:12px;padding:10px 0;border-radius:5px}
.message:hover{background:#292a2e22}
.message .avatar{width:40px;height:40px}
.msg-name{font-weight:bold;font-size:14px}
.msg-time{font-size:10px;color:var(--muted);font-weight:normal;margin-left:7px}
.msg-text{font-size:14px;line-height:1.5;overflow-wrap:anywhere;margin-top:5px}
.composer-wrap{padding:0 16px 20px}
.composer{background:var(--panel);border-radius:9px;display:flex;
 align-items:center;padding:8px 10px;gap:9px}
.composer button{background:transparent;color:var(--muted);font-size:22px}
.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;
 color:var(--text);font-size:14px;padding:8px 0}
.send{background:var(--accent)!important;color:white!important;
 border-radius:7px;padding:8px 12px!important;font-size:14px!important}
.members{width:200px;background:var(--bg);padding:22px 10px;overflow-y:auto}
.member-title{font-size:11px;color:var(--muted);font-weight:bold;
 margin:5px 7px 15px;letter-spacing:.6px}
.member{display:flex;align-items:center;gap:9px;padding:7px;border-radius:5px}
.member .avatar{width:32px;height:32px;font-size:17px}
.member .username{font-weight:normal;color:var(--muted)}
.online-dot{width:9px;height:9px;border-radius:50%;background:#23a559;
 border:2px solid var(--bg);position:relative;margin-left:-17px;margin-top:23px}
.mobile-menu{display:none}
.modal-bg{position:fixed;inset:0;background:#0009;display:none;
 align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{width:100%;max-width:350px;background:var(--side);padding:22px;
 border-radius:12px;box-shadow:0 15px 60px #0005}
.modal h3{margin-top:0}
.modal input{width:100%;padding:12px;background:var(--deep);border:0;
 border-radius:6px;color:white;outline:0;margin:10px 0 15px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-actions button{padding:10px 13px;border-radius:6px;background:var(--panel)}
.modal-actions .primary{background:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
 background:#17181b;color:white;padding:10px 15px;border-radius:8px;
 font-size:13px;display:none;z-index:20}
.light{--bg:#f2f3f5;--side:#e3e5e8;--deep:#d5d7db;--panel:#fff;
 --text:#25262a;--muted:#626773;--hover:#d1d4d9;--line:#c6c9cf}
@media(max-width:800px){.members{display:none}.sidebar{width:190px}}
@media(max-width:560px){
 .servers{width:56px;padding:10px 6px}.server{width:42px;height:42px}
 .server.active:before{left:-6px}
 .sidebar{display:none;position:fixed;z-index:5;top:0;bottom:0;left:56px;
 width:230px;box-shadow:8px 0 30px #0005}
 .sidebar.open{display:flex}
 .mobile-menu{display:inline-block!important}
 .topbar{height:55px;padding:0 10px}
 .welcome{padding:20px 13px 8px}.welcome h2{font-size:20px}
 .messages{padding:8px 10px}.composer-wrap{padding:0 9px 12px}
 .send{padding:9px!important;font-size:0!important}
 .send:after{content:"➤";font-size:15px}
 .userbox{padding:8px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="servers">
  <button class="server active" title="Ruang Diskusi" onclick="pilihServer(this,'Ruang Diskusi')">RD</button>
  <div class="separator"></div>
  <button class="server" title="Komunitas Game" onclick="pilihServer(this,'Komunitas Game')">🎮</button>
  <button class="server" title="Belajar" onclick="pilihServer(this,'Ruang Belajar')">📚</button>
  <button class="server add" title="Tambah server" onclick="toast('Fitur server baru bisa dikembangkan berikutnya')">+</button>
 </aside>

 <aside class="sidebar" id="sidebar">
  <div class="workspace"><span id="serverName">Ruang Diskusi</span>
   <button onclick="tambahChannel()" title="Tambah channel">＋</button>
  </div>
  <div class="channels">
   <div class="label">CHANNEL TEKS <span>⌄</span></div>
   <div id="channelList">
    <div class="channel active" data-channel="umum" onclick="pilihChannel('umum')"><span>#</span> umum</div>
    <div class="channel" data-channel="ngobrol" onclick="pilihChannel('ngobrol')"><span>#</span> ngobrol</div>
    <div class="channel" data-channel="game" onclick="pilihChannel('game')"><span>#</span> game</div>
    <div class="channel" data-channel="perkenalan" onclick="pilihChannel('perkenalan')"><span>#</span> perkenalan</div>
   </div>
   <div class="label" style="margin-top:25px">INFO SERVER</div>
   <div class="channel" onclick="bukaInfo()"><span>ⓘ</span> Tentang komunitas</div>
  </div>
  <div class="userbox">
   <div class="avatar" id="myAvatar">😎</div>
   <div><div class="username" id="myName">Pengunjung</div><div class="status">● Online</div></div>
   <div class="user-actions"><button onclick="gantiProfil()" title="Edit profil">⚙</button></div>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
   <span class="hash">#</span><span id="channelTitle">umum</span>
   <div class="spacer"></div>
   <button title="Daftar anggota" onclick="toggleAnggota()">♟</button>
   <button title="Ganti tema" onclick="gantiTema()">◐</button>
  </header>
  <div class="content">
   <section class="chat">
    <div class="welcome">
     <div class="welcome-icon">#</div>
     <h2 id="welcomeTitle">Selamat datang di #umum!</h2>
     <p>Ini adalah awal dari channel ini. Mulai obrolanmu di sini.</p>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer-wrap">
     <form class="composer" id="chatForm">
      <button type="button" onclick="toast('Fitur lampiran belum tersedia di demo ini')" title="Lampiran">＋</button>
      <input id="messageInput" autocomplete="off" placeholder="Kirim pesan ke #umum..." maxlength="1000">
      <button class="send" type="submit">Kirim</button>
     </form>
    </div>
   </section>
   <aside class="members" id="members">
    <div class="member-title">ONLINE — 2</div>
    <div class="member"><div class="avatar">😎</div><div class="username" id="memberMe">Pengunjung</div><span class="online-dot"></span></div>
    <div class="member"><div class="avatar">🤖</div><div class="username">Bot Demo</div><span class="online-dot"></span></div>
    <div class="member-title" style="margin-top:25px">OFFLINE — 0</div>
   </aside>
  </div>
 </main>
</div>

<div class="modal-bg" id="modalBg">
 <div class="modal"><h3 id="modalTitle">Pengaturan</h3><div id="modalBody"></div>
  <div class="modal-actions"><button onclick="tutupModal()">Batal</button><button class="primary" id="modalSave">Simpan</button></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
let nama=localStorage.getItem("rd_nama")||"Pengunjung";
let avatar=localStorage.getItem("rd_avatar")||"😎";
let channel="umum";
let data=JSON.parse(localStorage.getItem("rd_pesan")||"{}");
let tema=localStorage.getItem("rd_tema")||"dark";
let anggotaTampil=true;

const contoh={
 umum:[{nama:"Bot Demo",avatar:"🤖",teks:"Halo! Selamat datang di Ruang Diskusi 👋",waktu:"Sekarang"},
 {nama:"Bot Demo",avatar:"🤖",teks:"Pilih channel di sebelah kiri untuk mulai menjelajahi demo ini.",waktu:"Sekarang"}],
 ngobrol:[],game:[],perkenalan:[]
};
function simpan(){localStorage.setItem("rd_pesan",JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function waktu(){return new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function render(){
 let list=data[channel]||contoh[channel]||[];
 $("#messages").innerHTML=list.map(m=>`
 <div class="message"><div class="avatar">${esc(m.avatar||"🙂")}</div>
 <div><div class="msg-name">${esc(m.nama)}<span class="msg-time">${esc(m.waktu||"")}</span></div>
 <div class="msg-text">${esc(m.teks).replace(/\n/g,"<br>")}</div></div></div>`).join("");
 $("#messages").scrollTop=$("#messages").scrollHeight;
 $("#channelTitle").textContent=channel;
 $("#welcomeTitle").textContent="Selamat datang di #"+channel+"!";
 $("#messageInput").placeholder="Kirim pesan ke #"+channel+"...";
 $$(".channel[data-channel]").forEach(el=>el.classList.toggle("active",el.dataset.channel===channel));
}
function pilihChannel(n){
 channel=n;render();$("#sidebar").classList.remove("open");
}
function pilihServer(el,n){
 $$(".server").forEach(s=>s.classList.remove("active"));el.classList.add("active");
 $("#serverName").textContent=n;toast("Server demo: "+n);
}
$("#chatForm").addEventListener("submit",e=>{
 e.preventDefault();
 const teks=$("#messageInput").value.trim();if(!teks)return;
 if(!data[channel])data[channel]=contoh[channel]?[...contoh[channel]]:[];
 data[channel].push({nama,avatar,teks,waktu:waktu()});
 simpan();$("#messageInput").value="";render();
});
function toast(teks){
 const t=$("#toast");t.textContent=teks;t.style.display="block";
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2300);
}
function bukaModal(judul,isi,aksi){
 $("#modalTitle").textContent=judul;$("#modalBody").innerHTML=isi;
 $("#modalSave").onclick=aksi;$("#modalBg").style.display="flex";
}
function tutupModal(){$("#modalBg").style.display="none"}
function gantiProfil(){
 bukaModal("Edit Profil",`
 <label>Nama pengguna</label>
 <input id="editNama" maxlength="24" value="${esc(nama)}" placeholder="Nama kamu">
 <label>Avatar emoji</label>
 <input id="editAvatar" maxlength="4" value="${esc(avatar)}" placeholder="😎">`,
 ()=>{
 nama=$("#editNama").value.trim()||"Pengunjung";
 avatar=$("#editAvatar").value.trim()||"🙂";
 localStorage.setItem("rd_nama",nama);localStorage.setItem("rd_avatar",avatar);
 $("#myName").textContent=nama;$("#myAvatar").textContent=avatar;
 $("#memberMe").textContent=nama;$("#members .member .avatar").textContent=avatar;
 tutupModal();render();toast("Profil diperbarui");
 });
}
function tambahChannel(){
 bukaModal("Buat Channel",`<label>Nama channel</label>
 <input id="newChannel" maxlength="24" placeholder="misalnya: musik">`,
 ()=>{
 let n=$("#newChannel").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"-").replace(/-+/g,"-");
 if(!n){toast("Masukkan nama channel");return}
 if($(`[data-channel="${n}"]`)){toast("Channel sudah ada");return}
 const el=document.createElement("div");el.className="channel";el.dataset.channel=n;
 el.innerHTML="<span>#</span> "+esc(n);el.onclick=()=>pilihChannel(n);
 $("#channelList").appendChild(el);tutupModal();pilihChannel(n);toast("Channel dibuat");
 });
}
function gantiTema(){
 document.body.classList.toggle("light");
 tema=document.body.classList.contains("light")?"light":"dark";
 localStorage.setItem("rd_tema",tema);
}
function toggleAnggota(){
 anggotaTampil=!anggotaTampil;$("#members").style.display=anggotaTampil?"":"none";
}
function bukaInfo(){
 bukaModal("Tentang Ruang Diskusi",
 `<p style="color:var(--muted);line-height:1.6">Tempat untuk ngobrol, belajar, berbagi ide, dan bermain bersama.</p>
 <p style="font-size:12px;color:var(--muted)">Versi demo • Pesan tersimpan di perangkat ini.</p>`,
 ()=>tutupModal());
}
if(tema==="light")document.body.classList.add("light");
$("#myName").textContent=nama;$("#myAvatar").textContent=avatar;$("#memberMe").textContent=nama;
render();
</script>
</body>
</html>
